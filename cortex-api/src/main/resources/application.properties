# Force UTF-8 encoding on all requests/responses (Spring Boot default filter)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Java 25 Virtual Threads & Graceful Shutdown (Spring Boot 4.1)
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Cortex Asynchronous Git Sync Configuration (Spec 002 & Spec 007)
cortex.git.sync-enabled=true
cortex.git.command-timeout-seconds=15
cortex.git.stale-lock-timeout-seconds=60

